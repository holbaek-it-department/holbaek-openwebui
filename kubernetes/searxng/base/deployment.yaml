apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng

spec:
  replicas: 1

  selector:
    matchLabels:
      app: searxng

  template:
    metadata:
      labels:
        app: searxng

    spec:
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.9.17-c49771992
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: SEARXNG_SECRET

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: config
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true

            - name: config
              mountPath: /etc/searxng/limiter.toml
              subPath: limiter.toml
              readOnly: true

            - name: cache
              mountPath: /var/cache/searxng

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

      volumes:
        - name: config
          configMap:
            name: searxng-config

        - name: cache
          emptyDir: {}